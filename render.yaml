services:
  # ───────────────────────────────────────────────────────────────────
  # Backend API & Agent Swarm Execution Service
  # ───────────────────────────────────────────────────────────────────
  - type: web
    name: cofound-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: "cofound"

  # ───────────────────────────────────────────────────────────────────
  # Optional: Decoupled Static Frontend Site (React + Vite)
  # ───────────────────────────────────────────────────────────────────
  - type: static
    name: cofound-ui
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cofound-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
