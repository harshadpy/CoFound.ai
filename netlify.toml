# Netlify Configuration for CoFound.ai Frontend
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy API calls to your deployed FastAPI backend
# Replace destination URL with your live backend URL (e.g., on Render/Railway/Fly.io)
[[redirects]]
  from = "/api/*"
  to = "https://cofound-ai.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
